<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DODGE THE TNT — Jeu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="game.css" />
</head>

<body>
  <header>
    <a id="back" href="index.html" draggable="false">← Accueil</a>
    <h1><a href="index.html" draggable="false">DODGE THE TNT</a></h1>
    <img class="logo" src="image/TNT_JE3_BE2.jpg" alt="Logo TNT" />
  </header>

  <main>
    <section class="panel game-panel">
      <div id="hud" class="hud">
        <div class="hud-left">
          <span id="hud-username" class="chip">—</span>
          <span id="hud-difficulty" class="chip">Normal</span>
        </div>

        <div class="hud-right">
          <span class="chip">Score: <span id="hud-score">0</span></span>
          <span class="chip">Best: <span id="hud-best">0</span></span>
          <button id="pause_btn" class="btn ghost" type="button">Pause</button>
        </div>
      </div>

      <div id="game_container" tabindex="0" role="application" aria-label="Zone de jeu">
        <div id="player">
          <img id="player_image" src="image/jason.jpg" alt="Joueur" />
          <div id="player_username_container">
            <div id="player_username">—</div>
          </div>
        </div>

        <div id="start_overlay" class="overlay">
          <div class="overlay-card">
            <h2>Prêt ?</h2>
            <p>
              Esquive les TNT le plus longtemps possible.<br/>
              <span class="kbd">Entrée</span> ou <span class="kbd">Espace</span> pour commencer.
            </p>
            <div class="overlay-actions">
              <button id="start_btn" class="btn primary" type="button">Démarrer</button>
              <a class="btn ghost" href="index.html" draggable="false">Changer pseudo</a>
            </div>
          </div>
        </div>

        <div id="gameover_overlay" class="overlay hidden" aria-live="polite">
          <div class="overlay-card">
            <h2>💥 Game Over</h2>
            <p id="final_line">Score final : 0</p>
            <div class="overlay-actions">
              <button id="replay_btn" class="btn primary" type="button">Rejouer</button>
              <a class="btn ghost" href="index.html" draggable="false">Accueil</a>
            </div>
          </div>
        </div>

        <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
      </div>

      <div class="mini-row">
        <span class="mini">Touches : Flèches • <span class="kbd">P</span> pause • <span class="kbd">R</span> rejouer • <span class="kbd">S</span> sons</span>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 • Dodge the TNT</p>
  </footer>

  <script src="gameScript.js" defer></script>
</body>
</html>
